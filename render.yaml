services:
  - type: web
    name: ai-data-analyst-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000,http://localhost:5173"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: "production"
      - key: AUTO_VERIFY_USERS
        value: "false"
      - key: OTP_ENABLED
        value: "true"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USER
        value: "infinitics.ai.app@gmail.com"
      - key: SMTP_FROM
        value: "infinitics.ai.app@gmail.com"
      - key: SMTP_FROM_NAME
        value: "Infinitics AI"
      - key: SMTP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

